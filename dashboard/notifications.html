<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications & Reminders — Forget Me Not</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <div class="dashboard-layout" id="dashboard-app"></div>

    <script src="../js/storage.js"></script>
    <script src="../js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderDashboardSidebar('notifications');
            document.getElementById('page-heading').textContent = 'Notifications & Reminders';

            Storage.markNotificationsRead();
            const notifications = Storage.getNotifications();
            const mainBody = document.getElementById('dashboard-main-body');

            mainBody.innerHTML = `
                <div class="animate-fade-in">
                    <div class="dashboard-section-header">
                        <div>
                            <h2 style="font-size: 1.75rem; margin-bottom: var(--space-xs);">Upcoming Event Reminders</h2>
                            <p style="color: var(--color-muted);">In-app notifications for birthdays, anniversaries, and milestones.</p>
                        </div>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: var(--space-md);">
                        ${notifications.map(n => `
                            <div class="card" style="display: flex; align-items: flex-start; gap: var(--space-md);">
                                <div style="background-color: var(--color-surface); padding: 0.75rem; border-radius: 50%; color: var(--color-primary);">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                                </div>
                                <div style="flex-grow: 1;">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-xs);">
                                        <h3 style="font-size: 1.1rem;">${n.title}</h3>
                                        <span style="font-size: 0.85rem; color: var(--color-muted);">${n.date}</span>
                                    </div>
                                    <p style="color: var(--color-muted); font-size: 0.95rem;">${n.message}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
