<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Occasions — Forget Me Not</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <div class="dashboard-layout" id="dashboard-app"></div>

    <!-- Add Occasion Modal -->
    <div class="modal-overlay" id="occasion-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Add Occasion</h3>
                <button class="modal-close" id="close-modal">&times;</button>
            </div>
            <form id="occasion-form">
                <input type="hidden" id="occasion-id">
                <div class="form-group">
                    <label class="form-label" for="occ-profile">Recipient Profile</label>
                    <select id="occ-profile" class="form-select" required>
                        <!-- Populated via JS -->
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="occ-name">Occasion Name</label>
                    <input type="text" id="occ-name" class="form-input" required placeholder="e.g. 60th Birthday">
                </div>
                <div class="form-group">
                    <label class="form-label" for="occ-type">Occasion Type</label>
                    <select id="occ-type" class="form-select" required>
                        <option value="Birthday">Birthday</option>
                        <option value="Anniversary">Anniversary</option>
                        <option value="Graduation">Graduation</option>
                        <option value="Wedding">Wedding</option>
                        <option value="Achievement">Achievement</option>
                        <option value="Custom">Custom</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="occ-date">Date</label>
                    <input type="date" id="occ-date" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="occ-desc">Description / Notes</label>
                    <textarea id="occ-desc" class="form-textarea" rows="3" placeholder="Gift ideas, preferences, celebration plans..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Occasion</button>
            </form>
        </div>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderDashboardSidebar('occasions');
            document.getElementById('page-heading').textContent = 'Occasions & Important Events';

            const mainBody = document.getElementById('dashboard-main-body');
            const modalOverlay = document.getElementById('occasion-modal');
            const profileSelect = document.getElementById('occ-profile');

            function populateProfilesDropdown() {
                const profiles = Storage.getProfiles();
                profileSelect.innerHTML = profiles.map(p => `<option value="${p.id}">${p.name} (${p.relationship})</option>`).join('');
            }

            function renderOccasionsPage() {
                const profiles = Storage.getProfiles();
                const occasions = Storage.getOccasions();

                mainBody.innerHTML = `
                    <div class="animate-fade-in">
                        <div class="dashboard-section-header">
                            <div>
                                <h2 style="font-size: 1.75rem; margin-bottom: var(--space-xs);">Upcoming Occasions</h2>
                                <p style="color: var(--color-muted);">Never miss a milestone or special celebration.</p>
                            </div>
                            <button id="add-occasion-btn" class="btn btn-primary">+ Add Occasion</button>
                        </div>

                        <div class="card" style="padding: 0; overflow: hidden;">
                            <div class="table-container">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th>Occasion Name</th>
                                            <th>Recipient</th>
                                            <th>Type</th>
                                            <th>Date</th>
                                            <th>Notes</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${occasions.map(occ => {
                                            const prof = profiles.find(p => p.id === occ.profileId);
                                            return `
                                                <tr>
                                                    <td><strong>${occ.name}</strong></td>
                                                    <td>${prof ? prof.name : 'General'}</td>
                                                    <td><span class="badge badge-secondary">${occ.type}</span></td>
                                                    <td>${occ.date}</td>
                                                    <td style="color: var(--color-muted); max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${occ.notes || '-'}</td>
                                                    <td>
                                                        <div style="display: flex; gap: var(--space-sm);">
                                                            <a href="occasion-detail.html?id=${occ.id}" class="btn btn-primary btn-sm">Open Event</a>
                                                            <button class="btn btn-secondary btn-sm delete-btn" data-id="${occ.id}" style="color: var(--color-danger); border-color: rgba(163, 107, 107, 0.3);">Delete</button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById('add-occasion-btn').addEventListener('click', () => {
                    populateProfilesDropdown();
                    document.getElementById('modal-title').textContent = 'Add Occasion';
                    document.getElementById('occasion-id').value = '';
                    document.getElementById('occasion-form').reset();
                    modalOverlay.classList.add('active');
                });

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (confirm('Are you sure you want to delete this occasion?')) {
                            const id = btn.getAttribute('data-id');
                            Storage.deleteOccasion(id);
                            renderOccasionsPage();
                        }
                    });
                });
            }

            renderOccasionsPage();

            document.getElementById('close-modal').addEventListener('click', () => {
                modalOverlay.classList.remove('active');
            });

            document.getElementById('occasion-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const id = document.getElementById('occasion-id').value;
                const profileId = document.getElementById('occ-profile').value;
                const name = document.getElementById('occ-name').value;
                const type = document.getElementById('occ-type').value;
                const date = document.getElementById('occ-date').value;
                const notes = document.getElementById('occ-desc').value;

                const occasionData = { profileId, name, type, date, notes };

                if (id) {
                    Storage.updateOccasion(id, occasionData);
                } else {
                    Storage.addOccasion(occasionData);
                }
                modalOverlay.classList.remove('active');
                renderOccasionsPage();
            });
        });
    </script>
</body>
</html>
