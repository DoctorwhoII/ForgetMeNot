<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings & Subscription — Forget Me Not</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <div class="dashboard-layout" id="dashboard-app"></div>

    <script src="../js/storage.js"></script>
    <script src="../js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderDashboardSidebar('settings');
            document.getElementById('page-heading').textContent = 'Account Settings & Plan';

            const user = Storage.getUser();
            const mainBody = document.getElementById('dashboard-main-body');

            mainBody.innerHTML = `
                <div class="animate-fade-in" style="max-width: 800px;">
                    <div style="margin-bottom: var(--space-2xl);">
                        <h2 style="font-size: 1.75rem; margin-bottom: var(--space-xs);">Account Settings</h2>
                        <p style="color: var(--color-muted);">Manage your personal details and subscription tier.</p>
                    </div>

                    <div class="card" style="margin-bottom: var(--space-xl);">
                        <h3 style="font-size: 1.25rem; margin-bottom: var(--space-lg);">Profile Information</h3>
                        <form id="settings-form">
                            <div class="form-group">
                                <label class="form-label" for="set-name">Full Name</label>
                                <input type="text" id="set-name" class="form-input" value="${user.name}" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="set-email">Email Address</label>
                                <input type="email" id="set-email" class="form-input" value="${user.email}" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Update Profile</button>
                        </form>
                    </div>

                    <div class="card" style="background: linear-gradient(135deg, var(--color-surface-card) 0%, var(--color-surface) 100%);">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md);">
                            <h3 style="font-size: 1.25rem;">Current Subscription Tier</h3>
                            <span class="badge badge-primary" style="font-size: 0.9rem; padding: 0.35rem 1rem;">${user.tier}</span>
                        </div>
                        <p style="color: var(--color-muted); margin-bottom: var(--space-xl);">
                            ${user.tier === 'FREE' ? 'You are currently on the Free plan (limited to 3 relationship profiles).' : user.tier === 'STANDARD' ? 'You are on the Standard plan (up to 10 relationship profiles).' : 'You are on the Premium plan (unlimited profiles & priority consultations).'}
                        </p>
                        <div style="display: flex; gap: var(--space-md); flex-wrap: wrap;">
                            <a href="../pricing.html" class="btn btn-primary">Explore All Plans / Upgrade</a>
                            <button id="reset-data-btn" class="btn btn-secondary" style="color: var(--color-danger); border-color: rgba(163, 107, 107, 0.3);">Reset Demonstration Data</button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('settings-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('set-name').value;
                const email = document.getElementById('set-email').value;
                Storage.updateUser({ name, email });
                alert('Account settings updated successfully!');
                renderDashboardSidebar('settings');
            });

            document.getElementById('reset-data-btn').addEventListener('click', () => {
                if (confirm('Are you sure you want to reset all LocalStorage demonstration data to defaults?')) {
                    localStorage.clear();
                    Storage.init();
                    alert('Data reset successfully.');
                    window.location.reload();
                }
            });
        });
    </script>
</body>
</html>
